name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Validate theme JSON
        run: npm run validate-theme

      # Auto-bump the patch version so every push to main is a new release,
      # then push the version commit + tag back to main.
      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: bump version to %s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main --follow-tags

      # Package the VS Code extension
      - name: Package extension
        run: npm run package

      # Publish a GitHub Release with the .vsix attached
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          files: ./*.vsix
          generate_release_notes: true
